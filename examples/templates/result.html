<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session result · {{ reference }}</title>
    <style>
      body { font: 14px/1.5 -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; color: #222; }
      h1   { margin: 0 0 .5rem 0; }
      pre  { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 4px; overflow-x: auto; font-size: 12px; }
      .err { background: #fff1f1; color: #8b0000; padding: 1rem; border-left: 4px solid #e11d48; }
    </style>
  </head>
  <body>
    <h1>Session result</h1>
    <p>Reference: <code>{{ reference }}</code></p>
    {% if error %}
      <div class="err"><strong>Error:</strong> {{ error }}</div>
    {% endif %}
    {% if info %}
      <h2>Status</h2>
      <p><strong>{{ info['status']['status'] }}</strong> — {{ info['status']['message'] }}</p>
      <h2>Full response</h2>
      <pre>{{ info | tojson(indent=2) }}</pre>
    {% endif %}
    <p><a href="/">← Back</a></p>
  </body>
</html>
